<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Live Channel Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            background: black;
            font-family: Arial, sans-serif;
        }

        .telegram-bar {
            width: 100%;
            text-align: center;
            padding: 15px 0;
            background: black;
        }

        .telegram-btn {
            display: inline-block;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #0088cc, #00c6ff);
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.5);
            transition: 0.3s ease;
        }

        .telegram-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.8);
        }

        .player-container {
            width: 100%;
            height: calc(100vh - 80px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="telegram-bar">
    <a href="https://t.me/Ankmods0" target="_blank" class="telegram-btn">
        🚀 Join Our Telegram Channel
    </a>
</div>

<div class="player-container">
    <iframe 
        src="https://all-in-one-channel.vercel.app/STAR?id=148"
        allowfullscreen
        allow="autoplay; encrypted-media">
    </iframe>
</div>

</body>
</html>
<script>
function goToChannel(){
  window.location.href = "https://all-in-one-channel.vercel.app/STAR?id=148.";
}
</script>

</body>
</html>
