<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Asia Cup</title>
<style>
body{
  margin:0;
  background:#121212;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

/* ===== Overlay ===== */
#dialogOverlay{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(4px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  opacity:0;
  animation:fadeIn 0.4s forwards;
}
@keyframes fadeIn{
  to{opacity:1;}
}

/* ===== Animated Dialog Box ===== */
#dialogBox{
  width:85%;
  max-width:320px;
  background:#2c2c2c;
  border-radius:25px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5),
              0 -5px 20px rgba(255,255,255,0.05);
  text-align:center;
  overflow:hidden;
  transform: translateY(-50px) scale(0.8);
  animation:popIn 0.5s forwards;
  padding:25px 20px;
}
@keyframes popIn{
  0%{transform: translateY(-50px) scale(0.8); opacity:0;}
  60%{transform: translateY(10px) scale(1.05); opacity:1;}
  100%{transform: translateY(0) scale(1);}
}

/* ===== Title & Message ===== */
#dialogBox h2{
  margin:20px 15px 10px 15px;
  font-size:18px;
  font-weight:600;
  color:#fff;
}
#dialogBox p{
  margin:0 20px 20px 20px;
  font-size:15px;
  color:#ccc;
  line-height:1.4;
}

/* ===== Buttons Row ===== */
.buttonRow{
  display:flex;
  justify-content:center;
  margin-top:10px;
  gap:12px;
}
.buttonRow a, .buttonRow button{
  flex:1;
  padding:14px 0;
  font-size:17px;
  font-weight:600;
  border-radius:15px;
  border:none;
  cursor:pointer;
  transition: all 0.25s ease;
  text-decoration:none;
  box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}
.buttonRow a{
  background:#fff;
  color:#007AFF;
}
.buttonRow button{
  background:#fff;
  color:#007AFF;
}
.buttonRow a:hover,
.buttonRow button:hover{
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<div id="dialogOverlay">
  <div id="dialogBox">
    <h2>Join our Telegram Channel</h2>
    <p>Get instant cricket updates and exclusive content!</p>
    <div class="buttonRow">
      <a href="https://t.me/Ankmods0" target="_blank">Join</a>
      <button onclick="goToChannel()">OK</button>
    </div>
  </div>
</div>

<script>
function goToChannel(){
  window.location.href = "https://cricketstan.github.io/Channel-13/";
}
</script>

</body>
</html>
